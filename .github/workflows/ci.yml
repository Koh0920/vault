name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install pinned rclone (linux/amd64)
        run: |
          set -euo pipefail
          RCLONE_VERSION=1.73.3
          curl -fsSL -o /tmp/rclone.zip \
            "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSL -o /tmp/rclone.sha256 \
            "https://downloads.rclone.org/v${RCLONE_VERSION}/SHA256SUMS"
          expected=$(grep "rclone-v${RCLONE_VERSION}-linux-amd64.zip" /tmp/rclone.sha256 | awk '{print $1}')
          echo "${expected}  /tmp/rclone.zip" | sha256sum -c -
          unzip -o /tmp/rclone.zip -d /tmp/rclone-extract
          sudo cp "/tmp/rclone-extract/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  frontend:
    name: Frontend (tsc / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
