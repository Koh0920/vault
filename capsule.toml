schema_version = "0.3"
name = "vault"
version = "0.1.0"
description = "Encrypted backup to Google Drive — standalone web server (Axum + React), rclone crypt"
type = "app"
default_target = "web"

[targets.web]
runtime = "oci"
# Pinned to a release tag, not :latest, for reproducibility. CI (release.yml)
# builds this image, pushes it, and rewrites this field to an immutable
# @sha256:... digest before a release is tagged.
image = "ghcr.io/koh0920/vault:v0.1.0"
port = 8080

[network]
expose = ["8080/tcp"]
ingress = {}

# Fail closed at launch: these must be injected as ordinary environment.
required_env = [
	"GOOGLE_CLIENT_ID",
	"GOOGLE_CLIENT_SECRET",
	"VAULT_COOKIE_SECRET",
]

[env]
VAULT_LISTEN_ADDR = "0.0.0.0:8080"
VAULT_FRONTEND_DIR = "/app/frontend/dist"
VAULT_STATE_DIR = "/data"
VAULT_TEMP_DIR = "/tmp"

[metadata]
display_name = "Vault"
author = "Koh0920"
tags = ["backup", "google-drive", "rclone", "crypt", "encryption", "web"]
homepage = "https://github.com/Koh0920/vault"